[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pywswat"]

[tool.hatch.build.targets.sdist]
exclude = ["notebooks", "tests", "images"]

[project]
name = "pywswat"
version = "0.0.1"
dependencies = [
    "numpy",
    "scipy",
    "mikeio",
]

authors = [
  { name="First Last", email="initials@dhigroup.com" },
]
description = "Wave spectral analysis library"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    # Defensive guard: PyPI rejects unknown classifiers, so this prevents
    # accidental `twine upload` to public PyPI. Internal indexes (devpi etc.)
    # don't validate classifiers and accept the package normally.
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "ruff",
  "mypy",
  "mkdocs",
  "mkdocstrings[python]",
  "mkdocs-material"
]

build = [
  "build",
  "wheel",
  "twine",
]

test= [
  "pytest",
  "pytest-cov",
  "mypy",
]

notebooks = [
  "jupyter",
]


[project.urls]
"Homepage" = "https://github.com/DHI/pyWSWAT"
"Bug Tracker" = "https://github.com/DHI/pyWSWAT/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
# ignore long lines
lint.ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unreachable = false
no_implicit_optional = true
