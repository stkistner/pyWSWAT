# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Full test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      # Template guard: fails in derived repos until CODEOWNERS is updated.
      # Delete this step once your repo is set up.
      - name: Check CODEOWNERS was updated
        if: github.event.repository.name != 'template-python-library'
        shell: bash
        run: |
          if grep -q '@ecomodeller' .github/CODEOWNERS; then
            echo "::error::Update .github/CODEOWNERS to your team/user, then remove this step from full_test.yml."
            exit 1
          fi

      - uses: extractions/setup-just@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Quick lint
        uses: astral-sh/ruff-action@v3 # Fail fast if there are any linting errors

      - name: Install pywswat
        run: |
          just test-install
      - name: Static type check
        run: just typecheck
      - name: Test with pytest
        run: |
          just test
      - name: Test docstrings with pytest
        run: |
          just doctest
